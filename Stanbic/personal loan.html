<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Loan Application | Stanbic Bank Uganda</title>
<link rel="stylesheet" href="dlac.css">
</head>
<body>

<header class="site-header"><h1>Stanbic Bank Uganda</h1></header>
<nav class="navbar">
  <a href="index.html">Loan Products</a>
  <a href="personal loan.html" class="active">Personal Loan Application</a>
</nav>

<main class="form-wrap">
  <form action="#" method="post">
    <fieldset>
      <legend>Personal Loan Application</legend>

      <div class="row">
        <div class="field">
          <label for="title">Title</label>
          <select id="title" name="title">
            <option>Mr</option><option>Mrs</option><option>Ms</option><option>Dr</option><option>Prof</option>
          </select>
        </div>
        <div class="field">
          <label for="first">First Name</label>
          <input type="text" id="first" name="first_name" required>
        </div>
        <div class="field">
          <label for="last">Last Name</label>
          <input type="text" id="last" name="last_name" required>
        </div>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="0772 123 456" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </div>

      <div class="field">
        <label for="district">District</label>
        <select id="district" name="district">
          <option>Kampala</option><option>Wakiso</option><option>Mukono</option><option>Jinja</option><option>Mbarara</option>
        </select>
      </div>

      <div class="field">
        <label for="salary">Monthly Salary (UGX)</label>
        <input type="number" id="salary" name="salary" min="300000" step="1000">
        <div class="hint">Minimum UGX 300,000</div>
        <p class="field-msg" style="background:#EAF3DE; color:#27500A; padding:8px;">You appear eligible for this loan.</p>
      </div>

      <div class="field">
        <label for="amount">Loan Amount Requested (UGX)</label>
        <input type="number" id="amount" name="amount" min="0" step="1000">
      </div>

      <div class="row">
        <div class="field">
          <label for="period">Repayment Period</label>
          <select id="period" name="period">
            <option value="12">12 months</option><option value="24">24 months</option><option value="36">36 months</option>
          </select>
        </div>
        <div class="field">
          <label for="purpose">Loan Purpose</label>
          <select id="purpose" name="purpose">
            <option>School Fees</option><option>Medical</option><option>Home Improvement</option><option>Other</option>
          </select>
        </div>
      </div>

      <div class="declare">
        <input type="checkbox" id="declare" name="declaration" required>
        <label for="declare">I confirm that the information provided is accurate.</label>
      </div>

      <button type="submit" class="submit">Submit Application</button>
    </fieldset>
  </form>
</main>
</body>
</html>
